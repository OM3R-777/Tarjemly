name: Build Tarjemly APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and List Everything
        run: |
          echo "=== Unzipping Files ==="
          unzip Tarjemly_Ready_To_Build-2.zip -d project_files
          
          echo "=== Showing Directory Structure ==="
          find project_files -maxdepth 3
          
          echo "=== Searching for build.gradle ==="
          find project_files -name "build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          GRADLE_PATH=$(find project_files -name "build.gradle" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "ERROR: build.gradle not found anywhere in the zip!"
            exit 1
          fi
          cd $(dirname "$GRADLE_PATH")
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarjemly-App
          path: "**/build/outputs/apk/debug/*.apk"
