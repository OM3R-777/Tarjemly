name: Build Tarjemly APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip Tarjemly_Ready_To_Build-2.zip -d project_files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          KTS_PATH=$(find project_files -name "build.gradle.kts" | head -n 1)
          cd $(dirname "$KTS_PATH")
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarjemly-App
          path: "**/build/outputs/apk/debug/*.apk"
